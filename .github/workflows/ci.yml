name: CI
on:
  push:
    branches: [main, "engineering/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check      - name: Run reproducible benchmark smoke test
        run: npm run benchmark
